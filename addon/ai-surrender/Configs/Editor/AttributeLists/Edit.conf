SCR_EditorAttributeList {
 m_aAttributes + {
  ESR_EnabledAttribute {
   m_Key 0
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Enable surrender" Description "ON (default): AI squads that take heavy casualties may surrender. One global setting: every EXPBG AI Surrender module shows and edits the same values. OFF stops new surrenders; soldiers who already surrendered stay prisoners and can still be interrogated." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  ESR_ChanceAttribute {
   m_Key 1
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Surrender chance (%)" Description "Chance that each able soldier surrenders once his squad has broken. Nothing happens before that: the squad must first lose the Squad casualty threshold share of its men (default 50%, shifted by the random factor; for example 2 of a 4-man team). From then on every new casualty rolls each able soldier once. Soldiers in vehicles, unconscious soldiers, prisoners, squads with a player and civilian factions never roll." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_ThresholdAttribute {
   m_Key 2
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad casualty threshold (%)" Description "A squad breaks once this share of its members is dead, unconscious or captured. Squad size is the largest strength seen, at least the size the squad was spawned with." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 10 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_RandomAttribute {
   m_Key 3
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Random factor (+/- %)" Description "Spread so squads do not all behave alike: each squad's threshold is shifted once by up to this many percentage points, and every surrender roll shifts the chance by up to the same amount. 0 makes the settings exact." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 50 m_fStep 5 m_iDecimals 0 }
  }
  ESR_RevealChanceAttribute {
   m_Key 4
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Interrogation: reveal squad (%)" Description "Chance that an interrogated prisoner gives up the position of one nearby squad of his side. The interrogating player gets a removable map marker, visible to his faction. With no squad in range he gives his identity instead." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_IdentityChanceAttribute {
   m_Key 5
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Interrogation: identity (%)" Description "Chance that a prisoner gives his name, a short bio and his squad leader's name. Rolled after the reveal chance; reveal plus identity above 100% is capped. Otherwise he refuses to talk." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_IntelChanceAttribute {
   m_Key 12
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Interrogation: reveal intel items (%)" Description "Chance that a prisoner also points out the nearest intel items (EXPBG Intel Items, at most three) within the reveal search radius: lying on the ground, in a crate or vehicle, or on a body. Items a player carries, items he carries himself, and laptops or tablets a player has already read or picked up are left out. Rolled once, on its own, the first time he answers anything but a refusal; the squad and identity chances are unchanged. Each item gets a map marker for the interrogating player's faction, removed like the squad marker." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_RevealRadiusAttribute {
   m_Key 6
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Reveal search radius (m)" Description "How far from the prisoner a squad of his side may be to be revealed, and how far away the intel items he points out may lie. The nearest squad other than his own is chosen." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 100 m_fMax 3000 m_fStep 50 m_iDecimals 0 }
  }
  ESR_AttemptsAttribute {
   m_Key 7
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Interrogation attempts" Description "How often a prisoner can be questioned before he goes silent for good. Once he talks his answer is fixed; asking again repeats it and never creates a second marker." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 1 m_fMax 5 m_fStep 1 m_iDecimals 0 }
  }
  ESR_MarkerLifetimeAttribute {
   m_Key 8
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Intel marker lifetime (min)" Description "0 (default): a revealed squad or intel item marker stays until a player deletes it from the map. Otherwise the server removes it after this many minutes." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 120 m_fStep 5 m_iDecimals 0 }
  }
  ESR_DiagnosticsAttribute {
   m_Key 9
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Diagnostics" Description "Server log lines for every squad evaluation and interrogation. Surrenders are always logged once." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  ESR_CommanderGrenadeAttribute {
   m_Key 10
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Commander: grenade suicide instead of surrender (%)" Description "0 (default): squad leaders surrender like everyone else. Otherwise, when a broken squad's leader would surrender, this chance is rolled once for him: he crouches, sets a fragmentation grenade live at his feet and is killed by it a few seconds later instead of surrendering. The blast is a real grenade and also hurts anyone close by, his surrendering men included. The rest of the squad surrenders as usual. The leader is the squad's leader; with none, its highest-ranking able soldier." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_GrenadeCarryAttribute {
   m_Key 11
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Commander must carry a grenade" Description "ON (default): only a leader who carries a fragmentation grenade can use one; it is taken from his inventory, and a leader without one surrenders. OFF: a leader without one uses a vanilla fragmentation grenade of his side (M67 for US, RGD-5 otherwise)." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  ESR_PrisonersAttribute {
   m_Key 200
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Prisoners (read-only)" Description "Surrendered soldiers currently alive. Reopen the settings to refresh. Changing this value has no effect." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 64 m_fStep 1 m_iDecimals 0 }
  }
  ESR_GroupSurrenderAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad surrender chance (%)" Description "Surrender chance of every soldier of this AI squad, now and after it is reinforced. Use module setting (default) keeps the EXPBG AI Surrender module chance. Nothing happens until the squad breaks: it must first lose the module's Squad casualty threshold share of its men (default 50%, shifted by the random factor; for example 2 of a 4-man team). Then each able soldier rolls once per new casualty. 100% means all of them surrender once the squad has broken, not on first contact; 0% means none ever does. A set chance is exact (the random factor spreads only the module chance). A soldier's own setting wins over the squad's. Soldiers in vehicles and unconscious soldiers never roll. Shown for AI squads of any faction or mod (vanilla, RHS and others), also when you edit one of the squad's soldiers, with or without a module; surrenders need an EXPBG AI Surrender module, which decides when a squad breaks." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_GroupRevealAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad interrogation: reveal squad (%)" Description "Chance that a prisoner from this squad gives up a nearby squad of his side. Use module setting (default) keeps the module chance. Taken with him when he surrenders, so later changes to the squad do not change prisoners already taken. His own setting wins over the squad's." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_GroupIdentityAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad interrogation: identity (%)" Description "Chance that a prisoner from this squad gives his identity, rolled after the reveal chance (both together capped at 100%). Use module setting (default) keeps the module chance. Taken with him when he surrenders; his own setting wins." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_GroupIntelAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad interrogation: reveal intel items (%)" Description "Chance that a prisoner from this squad also points out nearby intel items, rolled once with his first answer other than a refusal. Use module setting (default) keeps the module chance. Taken with him when he surrenders; his own setting wins." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_UnitSurrenderAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Soldier surrender chance (%)" Description "Surrender chance of this AI soldier alone. Use squad or module setting (default) follows his squad's setting, else the module chance. A set chance is rolled once when he first comes under threat (danger or combat, e.g. fired at), whatever the size of his squad, and again after his squad has broken (lost the module's Squad casualty threshold share of its men), once per new casualty; it is exact. 100% means he gives up as soon as he is threatened; 0% means he never does. Not rolled while he is in a vehicle or unconscious. Shown for AI soldiers of any faction or mod, with or without a module; surrenders need an EXPBG AI Surrender module, which decides when a squad breaks." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_UnitRevealAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Soldier interrogation: reveal squad (%)" Description "Chance that this soldier, once a prisoner, gives up a nearby squad of his side. Use squad or module setting (default) follows his squad's setting when he surrendered, else the module chance. Can still be changed while he is a prisoner." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_UnitIdentityAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Soldier interrogation: identity (%)" Description "Chance that this soldier, once a prisoner, gives his identity, rolled after the reveal chance. Use squad or module setting (default) follows his squad's setting when he surrendered, else the module chance. Can still be changed while he is a prisoner." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_UnitIntelAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Soldier interrogation: reveal intel items (%)" Description "Chance that this soldier, once a prisoner, also points out nearby intel items. Use squad or module setting (default) follows his squad's setting when he surrendered, else the module chance. Can still be changed while he is a prisoner." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
 }
}
