SCR_EditorAttributeList {
 m_aAttributes + {
  ESR_EnabledAttribute {
   m_Key 0
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Enable surrender" Description "ON (default): AI squads that take heavy casualties may surrender. One global setting: every EXPBG AI Surrender module shows and edits the same values. OFF stops new surrenders; soldiers who already surrendered stay prisoners and can still be interrogated." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  ESR_ChanceAttribute {
   m_Key 1
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Surrender chance (%)" Description "Chance that each able soldier of a broken squad surrenders, rolled once per new casualty in that squad. Soldiers in vehicles, player-led squads and civilian factions never surrender." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_ThresholdAttribute {
   m_Key 2
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad casualty threshold (%)" Description "A squad breaks once this share of its members is dead, unconscious or captured. Squad size is the largest strength seen, at least the size the squad was spawned with." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 10 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_RandomAttribute {
   m_Key 3
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Random factor (+/- %)" Description "Spread so squads do not all behave alike: each squad's threshold is shifted once by up to this many percentage points, and every surrender roll shifts the chance by up to the same amount. 0 makes the settings exact." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 50 m_fStep 5 m_iDecimals 0 }
  }
  ESR_RevealChanceAttribute {
   m_Key 4
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Interrogation: reveal squad (%)" Description "Chance that an interrogated prisoner gives up the position of one nearby squad of his side. The interrogating player gets a removable map marker, visible to his faction. With no squad in range he gives his identity instead." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_IdentityChanceAttribute {
   m_Key 5
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Interrogation: identity (%)" Description "Chance that a prisoner gives his name, a short bio and his squad leader's name. Rolled after the reveal chance; reveal plus identity above 100% is capped. Otherwise he refuses to talk." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 100 m_fStep 5 m_iDecimals 0 }
  }
  ESR_RevealRadiusAttribute {
   m_Key 6
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Reveal search radius (m)" Description "How far from the prisoner a squad of his side may be to be revealed. The nearest squad other than his own is chosen." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 100 m_fMax 3000 m_fStep 50 m_iDecimals 0 }
  }
  ESR_AttemptsAttribute {
   m_Key 7
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Interrogation attempts" Description "How often a prisoner can be questioned before he goes silent for good. Once he talks his answer is fixed; asking again repeats it and never creates a second marker." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 1 m_fMax 5 m_fStep 1 m_iDecimals 0 }
  }
  ESR_MarkerLifetimeAttribute {
   m_Key 8
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Intel marker lifetime (min)" Description "0 (default): a revealed squad marker stays until a player deletes it from the map. Otherwise the server removes it after this many minutes." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 120 m_fStep 5 m_iDecimals 0 }
  }
  ESR_DiagnosticsAttribute {
   m_Key 9
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Diagnostics" Description "Server log lines for every squad evaluation and interrogation. Surrenders are always logged once." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  ESR_PrisonersAttribute {
   m_Key 200
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Prisoners (read-only)" Description "Surrendered soldiers currently alive. Reopen the settings to refresh. Changing this value has no effect." }
   m_CategoryConfig "{1B2983A072BEF915}Configs/Editor/AttributeCategories/EXPBG_Surrender.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues { m_fMin 0 m_fMax 64 m_fStep 1 m_iDecimals 0 }
  }
 }
}
