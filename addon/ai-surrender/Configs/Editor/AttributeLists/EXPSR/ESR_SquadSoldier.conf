SCR_EditorAttributeList {
 m_aAttributes {
  ESR_GroupSurrenderAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad surrender chance (%)" Description "Surrender chance of every soldier of this AI squad, now and after it is reinforced. Use module setting (default) keeps the EXPBG AI Surrender module chance. Nothing happens until the squad breaks: it must first lose the module's Squad casualty threshold share of its men (default 50%, shifted by the random factor; for example 2 of a 4-man team). Then each able soldier rolls once per new casualty. 100% means all of them surrender once the squad has broken, not on first contact; 0% means none ever does. A set chance is exact (the random factor spreads only the module chance). A soldier's own setting wins over the squad's. Soldiers in vehicles and unconscious soldiers never roll. Shown for AI squads of any faction or mod (vanilla, RHS and others), also when you edit one of the squad's soldiers, with or without a module; surrenders need an EXPBG AI Surrender module, which decides when a squad breaks." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_GroupRevealAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad interrogation: reveal squad (%)" Description "Chance that a prisoner from this squad gives up a nearby squad of his side. Use module setting (default) keeps the module chance. Taken with him when he surrenders, so later changes to the squad do not change prisoners already taken. His own setting wins over the squad's." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_GroupIdentityAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad interrogation: identity (%)" Description "Chance that a prisoner from this squad gives his identity, rolled after the reveal chance (both together capped at 100%). Use module setting (default) keeps the module chance. Taken with him when he surrenders; his own setting wins." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_GroupIntelAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Squad interrogation: reveal intel items (%)" Description "Chance that a prisoner from this squad also points out nearby intel items, rolled once with his first answer other than a refusal. Use module setting (default) keeps the module chance. Taken with him when he surrenders; his own setting wins." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_UnitSurrenderAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Soldier surrender chance (%)" Description "Surrender chance of this AI soldier alone. Use squad or module setting (default) follows his squad's setting, else the module chance. A set chance is rolled once when he first comes under threat (danger or combat, e.g. fired at), whatever the size of his squad, and again after his squad has broken (lost the module's Squad casualty threshold share of its men), once per new casualty; it is exact. 100% means he gives up as soon as he is threatened; 0% means he never does. Not rolled while he is in a vehicle or unconscious. Shown for AI soldiers of any faction or mod, with or without a module; surrenders need an EXPBG AI Surrender module, which decides when a squad breaks." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_UnitRevealAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Soldier interrogation: reveal squad (%)" Description "Chance that this soldier, once a prisoner, gives up a nearby squad of his side. Use squad or module setting (default) follows his squad's setting when he surrendered, else the module chance. Can still be changed while he is a prisoner." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_UnitIdentityAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Soldier interrogation: identity (%)" Description "Chance that this soldier, once a prisoner, gives his identity, rolled after the reveal chance. Use squad or module setting (default) follows his squad's setting when he surrendered, else the module chance. Can still be changed while he is a prisoner." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  ESR_UnitIntelAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo { Name "Soldier interrogation: reveal intel items (%)" Description "Chance that this soldier, once a prisoner, also points out nearby intel items. Use squad or module setting (default) follows his squad's setting when he surrendered, else the module chance. Can still be changed while he is a prisoner." }
   m_CategoryConfig "{5F9AC55BEEA3F6FA}Configs/Editor/AttributeCategories/EXPBG_SurrenderIntel.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
 }
}
