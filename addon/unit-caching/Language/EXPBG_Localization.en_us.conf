 Texts {
  "Global AI settings while this module exists: per-faction skill and aim accuracy with Rifleman, MG/LMG, Marksman and Leader overrides, default rules of engagement (per squad or soldier in the EXPBG Rules of Engagement tab of their Edit properties) and AI ammunition. Everything starts on vanilla. Place one; deleting the last module restores vanilla behaviour."
  "AI Global Skills"
  "Live briefing map. A player uses Brief on map: their map opens and their view, own markers and drawn lines appear on this board for everyone. Closing the map ends the briefing and frees the board."
  "Briefing Board"
  "Live briefing map on a projector screen (Projector Screen model from Structures For GM byHeine by Heine.CRV, APL-SA). A player uses EXPBG: Brief on map: their map opens and their view, own markers and drawn lines appear on the screen for everyone nearby, in the in-game map style. Closing the map ends the briefing and frees the screen. The picture is on the side the roller case sticks out to; turn that side toward the audience."
  "Briefing Projector Screen"
  "AI cache zone and owned-casualty cleanup. M.Pac and K.Edgar."
  "AI Cache Zone"
  "Global controls for Unit Caching zones only. Enable all, disable all, or safely prepare all AI for saving."
  "UNIT CACHING CONTROLLER"
  "10-15 unarmed civilians in one group gather at the centre and protest in place: no roaming, raised-hand and pointing gestures, angry and rioting crowd audio from EXPBG Ambient Sounds (Crowd sound: Angry, Rioting or Alternate, the default). Protesters turn to face a player they can see within 40 m. Rotate the module to aim the crowd. Crowd and sound exist only while a player character is within the Wake distance (default 300 m); otherwise the zone sleeps and brings the same civilians back when a player returns. New zones start Off."
  "Civil Protest Zone"
  "Garrisons random buildings within its radius: choose Generate in its attributes and up to 32 buildings (count or share of the eligible ones) each get one to four random squads of one or two factions (one faction per building), away from players. Every squad is an ordinary EXPBG garrison with caching and is saved with the mission; Regenerate, Clear and Stop act on this zone's garrisons only."
  "Random Garrison"
  "Global module: AI squads that take heavy casualties may surrender. Prisoners drop their weapons, sit down and can be interrogated by players for squad positions or identity intel. Place one; every copy edits the same global settings."
  "AI Surrender"
  "Time skip with a black screen: choose Skip time now in its attributes and every screen fades to black, shows the text (default 6 hours later) and the new time, the clock moves forward (the date rolls over) and the screens fade back in. Hours, minutes, fade times and text are set per module."
  "Time Skip"
  "Blends the weather to a chosen target (clouds, rain, fog, wind) over 1-120 real minutes instead of switching at once. Pick the target and press Save to start; a new transition takes over smoothly from the current weather. While a module exists, weather picked in Scenario Properties also blends over its transition time (switchable)."
  "Weather Transition"
 }
