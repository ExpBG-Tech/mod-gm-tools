SCR_EditorAttributeList {
 m_aAttributes + {
  EBG_EnabledAttribute {
   m_Key 0
   m_Checkbox 1
   m_Choice 0
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Enable caching"
    Description "New modules start OFF. Configure this zone, switch this ON, then Save and close. OFF restores its AI and stops addon cleanup. Saved enabled modules resume automatically after CDF or native mission loading; disabled modules remain OFF."
   }
   m_CategoryConfig "{0BBA58BEB8DF96C7}Configs/Editor/AttributeCategories/EXPBG_Cache.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"

  }
  EBG_MilitaryOnlyAttribute {
   m_Key 22
   m_Checkbox 1
   m_Choice 0
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Soldiers only"
    Description "ON (default): this zone caches military factions only and leaves every civilian faction alone. Civilians are cached by EXPBG Ambient Civilians, which has its own wake and sleep distances, so a zone placed over a town does not touch them. OFF: the zone also caches civilian-faction groups, for example civilians you placed by hand."
   }
   m_CategoryConfig "{0BBA58BEB8DF96C7}Configs/Editor/AttributeCategories/EXPBG_Cache.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"

  }
  EBG_ModeAttribute {
   m_Key 1
   m_Checkbox 0
   m_Choice 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Cache mode"
    Description "Simulation pauses and hides the existing AI, keeping equipment. Full removes living AI and respawns only those survivors with their original unit prefab's default kit and health. Custom equipment and ammunition reset; dead units stay dead. Positions and group waypoints are retained. Vehicle occupants and player-controlled units are excluded."
   }
   m_CategoryConfig "{0BBA58BEB8DF96C7}Configs/Editor/AttributeCategories/EXPBG_Cache.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Simulation cache"
     m_fEntryFloatValue 0
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Full cache"
     m_fEntryFloatValue 1
    }
   }
  }
  EBG_StrategyAttribute {
   m_Key 2
   m_Checkbox 0
   m_Choice 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Activation"
    Description "Whole zone wakes managed groups together around the module. Per group uses each retained group position independently."
   }
