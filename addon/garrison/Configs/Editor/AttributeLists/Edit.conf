SCR_EditorAttributeList {
 m_aAttributes + {
  EXPG_CacheModeAttribute {
   m_Key 0
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Garrison cache mode"
    Description "Off keeps the squad live. Simulation pauses the original soldiers when players are far away and resumes those same actors when players return. Equipment and casualty state are retained. Full caching is unsupported. Settings and garrison ownership last for this mission only; cold save/load restoration is not supported."
   }
   m_CategoryConfig "{9AA074A7EB574782}Configs/Editor/AttributeCategories/EXPG_Garrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_Choices {
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Off"
     m_fEntryFloatValue 0
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Simulation"
     m_fEntryFloatValue 1
    }
   }
  }
  EXPG_WakeDistanceAttribute {
   m_Key 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Wake distance (m)"
    Description "Wake the garrison when a player is within this distance. Range: 50 to 3000 metres. Increasing wake distance also raises sleep distance when needed to preserve at least 25 metres of separation. Default: 300 metres. Mission-only setting."
   }
   m_CategoryConfig "{9AA074A7EB574782}Configs/Editor/AttributeCategories/EXPG_Garrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 50
    m_fMax 3000
    m_fStep 25
    m_iDecimals 0
   }
  }
  EXPG_SleepDistanceAttribute {
   m_Key 2
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Sleep distance (m)"
    Description "Players must leave this larger distance before caching can begin. Range: 75 to 4000 metres; the server enforces at least wake distance plus 25 metres to prevent repeated switching at one boundary. Default: 400 metres. Mission-only setting."
   }
   m_CategoryConfig "{9AA074A7EB574782}Configs/Editor/AttributeCategories/EXPG_Garrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 75
    m_fMax 4000
    m_fStep 25
    m_iDecimals 0
   }
  }
  EXPG_GarrisonStatusAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Garrison status (read-only)"
    Description "Current replicated status. Select one squad and reopen attributes to refresh. No change can be applied through this field."
   }
   m_CategoryConfig "{9AA074A7EB574782}Configs/Editor/AttributeCategories/EXPG_Garrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  EXPG_ReleaseGarrisonAttribute {
   m_Key 3
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Release Garrison"
    Description "One-time action: check this and apply the attributes. Resume paused soldiers and release the squad to normal AI control. The action resets and is never replayed from mission saves."
   }
   m_CategoryConfig "{9AA074A7EB574782}Configs/Editor/AttributeCategories/EXPG_Garrison.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
 }
}
