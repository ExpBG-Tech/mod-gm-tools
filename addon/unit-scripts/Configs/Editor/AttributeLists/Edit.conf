  EUS_DisciplineAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "EXPBG Night discipline"
    Description "Night discipline of this AI group (EXPBG Unit Scripts). None: vanilla AI handles its lights. Light discipline: flashlights stay off and AI no longer switches them on; night vision devices already worn (modded gear) are switched on. Terror tactics: flashlights stay on and every soldier turns to face the nearest player within 60 metres so the beam points at them; real enemy targets still take priority. Applies to soldiers who join later. EXPBG Release Unit Scripts on the group also sets it back to None. Mission-only; not saved."
   }
   m_CategoryConfig "{C952695559974DF0}Configs/Editor/AttributeCategories/Group.conf"
