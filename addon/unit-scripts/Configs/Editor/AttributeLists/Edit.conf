SCR_EditorAttributeList {
 m_aAttributes + {
  EUS_UnitScriptAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "EXPBG Unit script"
    Description "Normal AI: no unit script. Hold position: stops roaming and stays on this spot; can still turn, aim, fire and change stance. Freeze: fully static, no movement or stance change and no aiming; only the head follows nearby players. Animation: plays one approved ambient animation and stays in it. Hold, Freeze and animations end when the unit takes damage, when a player takes control or when set back to Normal AI. Moving the unit with the editor keeps the script on the new spot. Mission-only; not saved."
   }
   m_CategoryConfig "{4F3669E88510C238}Configs/Editor/AttributeCategories/EUS_UnitScripts.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Normal AI"
     m_fEntryFloatValue 0
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Hold position"
     m_fEntryFloatValue 1
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Freeze"
     m_fEntryFloatValue 2
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Animation: Sit on the ground"
     m_fEntryFloatValue 10
    }
    SCR_EditorAttributeFloatStringValueHolder {
