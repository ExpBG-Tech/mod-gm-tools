    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Animation: Push-ups"
     m_fEntryFloatValue 16
    }
   }
  }
  EUS_SquadScriptAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "EXPBG Squad unit script"
    Description "Applies one unit script to every living AI soldier of this squad (see EXPBG Unit script on a soldier). Mixed means the soldiers differ; leaving it on Mixed changes nothing. Scripted squads are not enrolled by Unit Caching while a script or night discipline is active. Mission-only; not saved."
   }
   m_CategoryConfig "{4F3669E88510C238}Configs/Editor/AttributeCategories/EUS_UnitScripts.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
