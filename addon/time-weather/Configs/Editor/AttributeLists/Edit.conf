   m_UIInfo SCR_EditorAttributeUIInfo { Name "Target weather" Description "Weather to blend to. Changing any setting of this module and pressing Save starts the transition at once, from the weather as it is now; a new transition replaces a running one smoothly. A new module shows the current weather and keeps the clouds until you pick one." }
