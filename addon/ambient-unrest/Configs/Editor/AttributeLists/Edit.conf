SCR_EditorAttributeList {
 m_aAttributes + {
  EAU_EnabledAttribute {
   m_Key 0
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "On/Off"
    Description "Start or stop the protest. On gathers a fresh crowd a few civilians at a time; Off removes the crowd, its group and its sound a few entities at a time. New zones start Off."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  EAU_RadiusAttribute {
   m_Key 1
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Crowd area radius (m)"
    Description "Protesters stand inside this circle, densest at the centre. Shrinking it moves only the protesters outside the new edge."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 3
    m_fMax 30
    m_fStep 1
    m_iDecimals 0
   }
  }
  EAU_CrowdMinAttribute {
   m_Key 2
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Crowd size minimum"
    Description "Each start picks a crowd size between the minimum and the maximum (default 10-15). Casualties are not replaced."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 1
    m_fMax 30
    m_fStep 1
    m_iDecimals 0
   }
  }
  EAU_CrowdMaxAttribute {
   m_Key 3
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Crowd size maximum"
    Description "Upper end of the crowd size. A running crowd keeps its size if it still fits the new range."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 1
    m_fMax 30
    m_fStep 1
    m_iDecimals 0
   }
  }
  EAU_DebugAttribute {
   m_Key 4
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Debug"
    Description "Log lifecycle and ten-second status lines to the server script log, and show the crowd sound's audible range rings while the Game Master editor is open."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
 }
}
