SCR_EditorAttributeList {
 m_aAttributes + {
  EAU_EnabledAttribute {
   m_Key 0
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "On/Off"
    Description "Start or stop the protest. On gathers a fresh crowd a few civilians at a time; Off removes the crowd, its group and its sound a few entities at a time. A zone that is On sleeps while no player character is within the wake distance. New zones start Off."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  EAU_StatusAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Status (read-only)"
    Description "Off, Gathering, Protesting, or Sleeping (no player character within the wake distance; the crowd and its sound are removed and come back when a player approaches). Select one zone and reopen its attributes to refresh."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  EAU_RadiusAttribute {
   m_Key 1
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Crowd area radius (m)"
    Description "Protesters stand inside this circle, densest at the centre. Shrinking it moves only the protesters outside the new edge."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 3
    m_fMax 30
    m_fStep 1
    m_iDecimals 0
   }
  }
  EAU_CrowdMinAttribute {
   m_Key 2
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Crowd size minimum"
    Description "Each start picks a crowd size between the minimum and the maximum (default 10-15). Casualties are not replaced."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 1
    m_fMax 30
    m_fStep 1
    m_iDecimals 0
   }
  }
  EAU_CrowdMaxAttribute {
   m_Key 3
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Crowd size maximum"
    Description "Upper end of the crowd size. A running crowd keeps its size if it still fits the new range."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 1
    m_fMax 30
    m_fStep 1
    m_iDecimals 0
   }
  }
  EAU_CrowdSoundAttribute {
   m_Key 5
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Crowd sound"
    Description "Crowd recording: Angry crowd, Rioting crowd, or Alternate, which switches between the two on every loop. A change restarts the sound at once. New zones use Alternate."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Angry crowd" m_fEntryFloatValue 0 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Rioting crowd" m_fEntryFloatValue 1 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Alternate" m_fEntryFloatValue 2 }
   }
  }
  EAU_WakeDistanceAttribute {
   m_Key 6
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Wake distance (m)"
    Description "The crowd and its sound exist only while a player character is this close (Game Masters count only by their character). When every player is 50 m farther away for 10 seconds the zone sleeps: crowd, group and sound are removed and the survivors are remembered. A player coming within this distance brings the same civilians back to their spots; casualties are not replaced. Range 50 to 3000 m, default 300."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 50
    m_fMax 3000
    m_fStep 25
    m_iDecimals 0
   }
  }
  EAU_DebugAttribute {
   m_Key 4
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Debug"
    Description "Log lifecycle and ten-second status lines to the server script log, and show the crowd sound's audible range rings while the Game Master editor is open."
   }
   m_CategoryConfig "{EA7B0AC9B7AEF08A}Configs/Editor/AttributeCategories/EXPAU_Unrest.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
 }
}
