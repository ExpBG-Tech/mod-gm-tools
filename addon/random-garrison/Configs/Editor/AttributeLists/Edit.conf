SCR_EditorAttributeList {
 m_aAttributes + {
  EXPG_RGStatusAttribute {
   m_bIsServer 0
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Status (read-only)"
    Description "What the zone is doing: Idle, Collecting buildings, Reading squad catalog, Analysing, Spawning, Waiting (players near, AI limit), Paused (saving or loading), Done, Clearing, Stopped or Loaded. Select one zone and reopen its attributes to refresh."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  EXPG_RGRunAttribute {
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Action"
    Description "Choose and press Save. Generate garrisons random buildings in the radius (once; afterwards use Regenerate or Clear). Regenerate clears this zone's garrisons, then generates again. Clear generated garrisons deletes this zone's garrisons (squads released by Force Move, possession or surrender are kept). Stop cancels the work in progress and keeps the garrisons already deployed. The action resets to No action. Every squad is an ordinary garrison: caching, Force Move and Add Garrison work on it as usual; casualties are never refilled and the zone never generates again by itself."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "No action" m_fEntryFloatValue 0 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Generate" m_fEntryFloatValue 1 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Regenerate" m_fEntryFloatValue 2 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Clear generated garrisons" m_fEntryFloatValue 3 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Stop" m_fEntryFloatValue 4 }
   }
  }
  EXPG_RGRadiusAttribute {
   m_Key 0
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Radius (m)"
    Description "Buildings whose centre is inside this circle can be garrisoned (25 to 1000 m, default 150). The circle is shown while the zone is visible in the editor."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 25
    m_fMax 1000
    m_fStep 25
    m_iDecimals 0
   }
  }
  EXPG_RGFactionAttribute {
   m_Key 14
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Faction"
    Description "Squads come from this faction's Game Master squad list (military factions of the mission, including modded ones). Default: USSR when present, else the first faction."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  EXPG_RGSecondFactionAttribute {
   m_Key 15
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Second faction"
    Description "None (default), or a second faction: each building then draws one of the two factions at 50/50, so one building never holds both. Hostile factions in neighbouring buildings will fight each other."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  EXPG_RGSizesAttribute {
   m_Key 1
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Squad sizes"
    Description "Squad sizes to pick from, by the number of soldiers: small teams 1-3, fire teams 4-5, squads 6-9, large 10 or more. A building only gets squads that fit its posts; nobody is ever removed from a squad. Default: Fire teams and squads."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Fire teams (4-5)" m_fEntryFloatValue 2 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Fire teams and squads (4-9)" m_fEntryFloatValue 6 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Squads (6-9)" m_fEntryFloatValue 4 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Squads and large (6+)" m_fEntryFloatValue 12 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Small teams and fire teams (1-5)" m_fEntryFloatValue 3 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Any" m_fEntryFloatValue 15 }
   }
  }
  EXPG_RGExcludeSupportAttribute {
   m_Key 2
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Exclude support squads"
    Description "Skip medical, logistics, ammo and crew squads (vehicle and helicopter crews, pilots) and essential squads, also those of other mods (default on)."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  EXPG_RGBuildingsAttribute {
   m_Key 3
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Buildings"
    Description "How many buildings to garrison (1 to 32, default 4). With Share below 100% the smaller of the two counts is used."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 1
    m_fMax 32
    m_fStep 1
    m_iDecimals 0
   }
  }
  EXPG_RGShareAttribute {
   m_Key 4
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Share of buildings (%)"
    Description "At most this share of the buildings that can be garrisoned in the radius (1 to 100%, default 100)."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 1
    m_fMax 100
    m_fStep 1
    m_iDecimals 0
   }
  }
  EXPG_RGSquadsMinAttribute {
   m_Key 5
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Squads per building, minimum"
    Description "Each building draws a squad count between the minimum and the maximum (1 to 4, default 1-2). A building whose posts are full takes fewer squads."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 1
    m_fMax 4
    m_fStep 1
    m_iDecimals 0
   }
  }
  EXPG_RGSquadsMaxAttribute {
   m_Key 6
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Squads per building, maximum"
    Description "Upper end of the squad count per building. A lower maximum lowers the minimum with it."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 1
    m_fMax 4
    m_fStep 1
    m_iDecimals 0
   }
  }
  EXPG_RGPlayerDistanceAttribute {
   m_Key 7
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Distance from players (m)"
    Description "No building closer than this to a player character is garrisoned (0 to 1000 m, default 200); a building a player approaches waits, and after two minutes another one is used. Game Master cameras do not count. Distance only, no line of sight."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 0
    m_fMax 1000
    m_fStep 25
    m_iDecimals 0
   }
  }
  EXPG_RGAllowGarrisonedAttribute {
   m_Key 8
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Allow garrisoned buildings"
    Description "Also use buildings that already have a garrison (default off); new squads then take the free posts and the faction already there. A building held by a faction this zone does not use, or by several factions, is skipped."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  EXPG_RGSeedAttribute {
   m_Key 9
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Seed"
    Description "0 (default) draws a new seed on every Generate; the status shows the seed used. The same seed picks the same buildings and squads again while the town, its damage, the players' positions and the other garrisons are the same."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 0
    m_fMax 9999
    m_fStep 1
    m_iDecimals 0
   }
  }
  EXPG_RGCacheModeAttribute {
   m_Key 10
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Garrison cache mode"
    Description "Cache mode of the generated garrisons, as on a garrison squad: Full (default), Simulation or Off. A change applies to this zone's garrisons at once."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Off" m_fEntryFloatValue 0 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Simulation" m_fEntryFloatValue 1 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Full (prefab defaults)" m_fEntryFloatValue 2 }
   }
  }
  EXPG_RGWakeAttribute {
   m_Key 11
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Garrison wake distance (m)"
    Description "Wake distance of the generated garrisons (50 to 3000 m, default 300). A change applies to this zone's garrisons at once."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 50
    m_fMax 3000
    m_fStep 25
    m_iDecimals 0
   }
  }
  EXPG_RGSleepAttribute {
   m_Key 12
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Garrison sleep distance (m)"
    Description "Sleep distance of the generated garrisons (75 to 4000 m, default 400; at least the wake distance plus 25 m). A change applies to this zone's garrisons at once."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues {
    m_fMin 75
    m_fMax 4000
    m_fStep 25
    m_iDecimals 0
   }
  }
  EXPG_RGOnDeleteAttribute {
   m_Key 13
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "When the zone is deleted"
    Description "Keep garrisons (default): deleting the zone stops its work and leaves its deployed garrisons as ordinary garrisons. Delete garrisons: they are removed with it, a few soldiers at a time."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Keep garrisons" m_fEntryFloatValue 0 }
    SCR_EditorAttributeFloatStringValueHolder { m_sEntryName "Delete garrisons" m_fEntryFloatValue 1 }
   }
  }
  EXPG_RGSavedStateAttribute {
   m_bIsServer 1
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Saved state"
    Description "Never shown: lets attribute-based saves (CDF Game Master Save) keep which garrisons belong to this zone."
   }
   m_CategoryConfig "{FEF745598F49F211}Configs/Editor/AttributeCategories/EXPGR_RandomGarrison.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
 }
}
