    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Use squad or module setting"
     m_fEntryFloatValue 0
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Novice"
     m_fEntryFloatValue 1
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Rookie"
     m_fEntryFloatValue 2
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Regular"
     m_fEntryFloatValue 3
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Veteran"
     m_fEntryFloatValue 4
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Expert"
     m_fEntryFloatValue 5
    }
   }
  }
  EGS_GroupRoeAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Rules of engagement (squad)"
    Description "Rules of engagement of every soldier of this AI squad, now and after it is reinforced. Works for squads of any faction or mod (vanilla, RHS and others), with or without an EXPBG AI Global Skills module. Module default follows the module's default rules of engagement (vanilla without a module). Return Fire Only: hold fire until fired upon (a member hit or killed by an enemy, an enemy round within about 4 m of a member, or an enemy explosion within about 10 m), then return fire until the contact is over. Fire on Sight: engage any identified enemy. Warning Shots First: 2-3 rounds beside a spotted player (on foot or in a vehicle), 5 s pause, then lethal. Exempt (vanilla) leaves this squad's combat mode to Set combat mode; changing Set combat mode on a squad with EXPBG rules of engagement switches this setting to Exempt (vanilla). A soldier's own rules of engagement win over the squad's. Also shown when you edit one of the squad's soldiers."
   }
   m_CategoryConfig "{CB1FB5533BC95820}Configs/Editor/AttributeCategories/EGS_Roe.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Module default"
     m_fEntryFloatValue 0
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Return Fire Only"
     m_fEntryFloatValue 1
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Fire on Sight"
     m_fEntryFloatValue 2
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Warning Shots First"
     m_fEntryFloatValue 3
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Exempt (vanilla)"
     m_fEntryFloatValue 4
    }
   }
  }
  EGS_UnitRoeAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "Rules of engagement (soldier)"
    Description "Rules of engagement of this AI soldier alone, for soldiers of any faction or mod, with or without an EXPBG AI Global Skills module. Use squad setting follows his squad's rules of engagement (and so the module default). Return Fire Only: he holds fire, suppressive fire included, until his squad is fired upon. Fire on Sight: he engages any identified enemy. Warning Shots First: he fires 2-3 rounds beside a player he spots (on foot or in a vehicle), waits 5 s, then is lethal. Exempt (vanilla): he follows the combat mode his squad would have without EXPBG. Player squads keep vanilla behaviour."
   }
   m_CategoryConfig "{CB1FB5533BC95820}Configs/Editor/AttributeCategories/EGS_Roe.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
