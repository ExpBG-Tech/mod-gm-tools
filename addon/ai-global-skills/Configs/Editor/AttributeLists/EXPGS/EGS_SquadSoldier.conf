SCR_EditorAttributeList {
 m_aAttributes {
  EGS_GroupSkillAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "AI skill (squad)"
    Description "Skill of every soldier of this AI squad, now and after it is reinforced: the vanilla skill tier (aiming spread) and how fast they spot enemies (Novice 60%, Rookie 80%, Regular 100%, Veteran 120%, Expert 140%). Works for squads of any faction or mod (vanilla, RHS and others), with or without an EXPBG AI Global Skills module. Use module setting (default) keeps the module's skill for the squad's faction and role, or vanilla without a module. Aim accuracy and ammunition stay the module's. A soldier's own skill wins over the squad's. Also shown when you edit one of the squad's soldiers."
   }
   m_CategoryConfig "{CB1FB5533BC95820}Configs/Editor/AttributeCategories/EGS_Roe.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
   m_aValues {
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Use module setting"
     m_fEntryFloatValue 0
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Novice"
     m_fEntryFloatValue 1
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Rookie"
     m_fEntryFloatValue 2
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Regular"
     m_fEntryFloatValue 3
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Veteran"
     m_fEntryFloatValue 4
    }
    SCR_EditorAttributeFloatStringValueHolder {
     m_sEntryName "Expert"
     m_fEntryFloatValue 5
    }
   }
  }
  EGS_UnitSkillAttribute {
   m_UIInfo SCR_EditorAttributeUIInfo {
    Name "AI skill (soldier)"
    Description "Skill of this AI soldier alone: the vanilla skill tier (aiming spread) and how fast he spots enemies (Novice 60%, Rookie 80%, Regular 100%, Veteran 120%, Expert 140%). Works for soldiers of any faction or mod, with or without an EXPBG AI Global Skills module. Use squad or module setting (default) follows his squad's skill, else the module's skill for his faction and role, else vanilla. Player-controlled characters keep vanilla."
   }
   m_CategoryConfig "{CB1FB5533BC95820}Configs/Editor/AttributeCategories/EGS_Roe.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
